[project]
name = "clerk"
version = "1.0.0"
description = "Local pipeline for transcription and meeting bullet points"
readme = "README.md"
authors = [{ name = "Gabrigas", email = "artroxgabriel@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "av<19",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "typer>=0.27.3",
    "yt-dlp>=2026.8.19",
]

[project.optional-dependencies]
cuda = [
    "nvidia-cublas-cu12>=12.1.3.1",
    "nvidia-cudnn-cu12>=9.1.0.70",
]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[project.scripts]
clerk = "clerk.cli:app"
clerk-test = "pytest:main"

[build-system]
requires = ["uv_build>=0.11.28"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyrefly>=1.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
addopts = "--cov=clerk --cov-report=term-missing --cov-fail-under=85"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501", "B008"]
