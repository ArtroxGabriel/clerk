name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*.*.*" ]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/ci.yml"
      - ".github/workflows/quality-gate.yml"
  workflow_dispatch:

jobs:
  checks:
    name: Quality Gate
    uses: ./.github/workflows/quality-gate.yml
